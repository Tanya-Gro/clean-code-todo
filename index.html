<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg" />
      <a
        class="more-inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </div>
    <div class="centered-main-page-element">
      <div class="add-task-section">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" />
          <button class="add-button">Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul class="incomplete-tasks-section">
        <li>
          <input class="task-checkbox" type="checkbox" />
          <label class="task">Pay Bills</label>
          <input type="text" class="task" />
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
        <li class="edit-mode">
          <input class="task-checkbox" type="checkbox" />
          <label class="task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task" />
          <button class="edit-button">Save</button>
          <button class="delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul class="completed-tasks-section">
        <li>
          <input class="task-checkbox" type="checkbox" checked />
          <label class="task">See the Doctor</label>
          <input type="text" class="task" />
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
