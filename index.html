<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg" />
      <a
        class="more-inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </div>
    <div class="centered-main-page-element">
      <div class="add-task-section">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" />
          <button class="add-button">Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul class="incomplete-tasks-section"></ul>
      <h3>Completed</h3>
      <ul class="completed-tasks-section"></ul>
    </div>
    <template id="task-template">
      <li>
        <input class="task-checkbox" type="checkbox" />
        <label class="task task-text"></label>
        <input type="text" class="task task-input" />
        <button class="edit-button">Edit</button>
        <button class="delete-button">
          <img src="./remove.svg" alt="Delete" />
        </button>
      </li>
    </template>
    <script src="app.js"></script>
  </body>
</html>
